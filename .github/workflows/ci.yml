name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: bash -n deploy.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @burrow/client build
      - name: Headless end-to-end smoke
        run: |
          pnpm --filter @burrow/match-server exec tsx src/index.ts &
          sleep 3
          pnpm --filter @burrow/match-server exec tsx src/smoke.ts
